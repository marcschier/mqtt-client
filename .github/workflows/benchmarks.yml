name: benchmarks

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'BenchmarkDotNet --filter glob (default: all)'
        required: false
        default: '*'
      full:
        description: 'Use DefaultJob (slow, higher-fidelity) instead of ShortRun'
        required: false
        default: 'false'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Mqtt.Client.Benchmarks/**'
      - '.github/workflows/benchmarks.yml'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build benchmarks
        run: dotnet build tests/Mqtt.Client.Benchmarks -c Release

      - name: Run benchmarks
        working-directory: tests/Mqtt.Client.Benchmarks
        env:
          FILTER: ${{ inputs.filter || '*' }}
          FULL: ${{ inputs.full || 'false' }}
        run: |
          ARGS=(--filter "$FILTER" --report)
          if [ "$FULL" = "true" ]; then ARGS+=(--full); fi
          dotnet run -c Release --no-build -- "${ARGS[@]}"
          shopt -s nullglob
          REPORTS=(BenchmarkDotNet.Artifacts/results/*-report-full.json)
          if [ "${#REPORTS[@]}" -eq 0 ]; then
            echo "::error::No benchmark reports were produced"
            exit 1
          fi
          for report in "${REPORTS[@]}"; do
            jq -e '.Benchmarks | length > 0 and all(.Statistics != null)' "$report" > /dev/null
          done

      - name: Upload BenchmarkDotNet artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmarks-${{ github.run_id }}
          path: |
            tests/Mqtt.Client.Benchmarks/BenchmarkDotNet.Artifacts/**
            docs/benchmarks.md
            README.md
